<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 378.9 446.19" class="animated-checkmark">
  <defs>
    <style>
      /* Alapértelmezett stílusok */
      .animated-checkmark {
        opacity: 0;
      }

      /* Kör elem */
      .checkmark-circle {
        fill: none;
        stroke: #caa961;
        stroke-miterlimit: 10;
        stroke-width: 15px;
        stroke-dasharray: 1072;
        stroke-dashoffset: 1072;
      }

      /* Pipa elem */
      .checkmark-check {
        fill: none;
        stroke: #caa961;
        stroke-linecap: round;
        stroke-miterlimit: 10;
        stroke-width: 27.76px;
        stroke-dasharray: 250;
        stroke-dashoffset: 250;
      }

      /* Animáció */
      @keyframes drawCircle {
        to {
          stroke-dashoffset: 0;
        }
      }

      @keyframes drawCheck {
        to {
          stroke-dashoffset: 0;
        }
      }

      @keyframes fadeIn {
        to {
          opacity: 1;
        }
      }

      /* Animáció alkalmazása automatikusan */
      .animated-checkmark {
        animation: fadeIn 0.3s ease forwards;
      }

      .checkmark-circle {
        animation: drawCircle 1.5s cubic-bezier(0.4, 0, 0.2, 1) 0.3s forwards;
      }

      .checkmark-check {
        animation: drawCheck 0.8s cubic-bezier(0.4, 0, 0.2, 1) 1.8s forwards;
      }
    </style>
  </defs>

  <!-- Kör - először rajzolódik -->
  <circle class="checkmark-circle" cx="189.45" cy="223.09" r="170.67"/>

  <!-- Pipa - másodszorra rajzolódik -->
  <polyline class="checkmark-check" points="111.52 224.01 160.61 277.17 267.38 169.02"/>
</svg>
